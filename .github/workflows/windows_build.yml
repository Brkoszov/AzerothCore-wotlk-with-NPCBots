name: windows-build

on:
  workflow_dispatch:
  push:
    branches:
      - 'npcbots_3.3.5'
      - 'CI'
  pull_request:
    types:
      - labeled
      - synchronize

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }}
    env:
      BOOST_ROOT: C:\local\boost_1_87_0
    if: >
      github.repository == 'Brkoszov/AzerothCore-wotlk-with-NPCBots' &&
      (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    steps:
      - uses: actions/checkout@v7

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2.13

      - name: Cache Boost & MySQL
        uses: actions/cache@v6
        with:
          path: |
            C:\local\boost_1_87_0
            C:\tools\mysql\current
          key: winbuild-deps:boost-1.87.0:mysql-8.4.9

      - name: Configure OS
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # ... tvůj původní obsah ...
          # ... Boost + MySQL + OpenSSL setup ...

      - name: Build
        shell: bash
        run: |
          export CTOOLS_BUILD=all
          ./acore.sh compiler build

      - name: Archive Windows build
        if: always()
        shell: pwsh
        run: |
          $workspace = $env:GITHUB_WORKSPACE
          $artifactDir = Join-Path $workspace 'artifact-upload'
          New-Item -ItemType Directory -Path $artifactDir -Force | Out-Null

          $archivePath = Join-Path $artifactDir 'windows-build.zip'
          $pathsToArchive = @(
            (Join-Path $workspace 'build'),
            (Join-Path $workspace 'bin'),
            (Join-Path $workspace 'build\bin'),
            (Join-Path $workspace 'src\server'),
            (Join-Path $workspace 'bin\Release')
          ) | Where-Object { $_ -and (Test-Path $_) }

          if (-not $pathsToArchive)
          {
            throw 'No build output was found to archive. Check the build output directories.'
          }

          Compress-Archive -Path $pathsToArchive -DestinationPath $archivePath -Force
          Write-Host "Archive created: $archivePath"

      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-${{ github.run_id }}
          path: ${{ github.workspace }}/artifact-upload/windows-build.zip
          if-no-files-found: error
          retention-days: 7
